name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Static Syntax Verification
        run: python -m py_compile scripts/check_health.py scripts/track_progress.py tests/test_check_health.py tests/test_track_progress.py

      - name: Run Unit Tests
        run: python -m unittest discover

      - name: Verify Health Inspector & Stack Self-Detection
        run: |
          python scripts/check_health.py --json
          python -c "import subprocess, json; res = json.loads(subprocess.check_output(['python', 'scripts/check_health.py', '--json'])); assert any(s['name'] == 'Python' for s in res['detected_stacks']), 'Python stack must be detected'"

      - name: Verify Track Progress Script
        run: python scripts/track_progress.py examples/sample-improvements.md --json

      - name: Verify Bash Script Syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n install.sh
