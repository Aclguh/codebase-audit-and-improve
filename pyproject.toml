[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-audit-and-improve"
version = "1.0.0"
description = "Universal multi-agent codebase health audit, planning, and atomic implementation workflow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Aclguh"}
]
keywords = [
    "codebase-audit",
    "multi-agent",
    "improvements",
    "antigravity",
    "claude-code",
    "cursor",
    "codex",
    "code-quality"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Aclguh/codebase-audit-and-improve"
Repository = "https://github.com/Aclguh/codebase-audit-and-improve.git"

[project.scripts]
check-health = "scripts.check_health:main"
track-progress = "scripts.track_progress:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "ruff>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["tests*", "docs*", "templates*", "examples*", "references*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
